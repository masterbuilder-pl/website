<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130">
  <defs>
    <radialGradient id="faceGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0cc5a"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </radialGradient>
    <radialGradient id="hatGrad" cx="38%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#e0bc50"/>
      <stop offset="100%" stop-color="#9a7224"/>
    </radialGradient>
  </defs>

  <!-- Hat dome — wide, tall, dominates top -->
  <path d="M18 62 C17 38 28 10 60 8 C92 10 103 38 102 62" fill="url(#hatGrad)"/>
  <path d="M18 62 C17 38 28 10 60 8 C92 10 103 38 102 62" fill="none" stroke="#7a5c1a" stroke-width="1"/>
  <!-- Hat highlight -->
  <path d="M34 40 C40 24 56 14 72 18" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>

  <!-- Hat brim — wider than face -->
  <ellipse cx="60" cy="63" rx="44" ry="7.5" fill="url(#hatGrad)"/>
  <ellipse cx="60" cy="63" rx="44" ry="7.5" fill="none" stroke="#7a5c1a" stroke-width="1"/>
  <ellipse cx="60" cy="62" rx="36" ry="4" fill="rgba(255,255,255,0.08)"/>

  <!-- Head — narrower than hat brim -->
  <rect x="36" y="63" width="48" height="42" rx="6" fill="url(#faceGrad)"/>
  <!-- Head top highlight -->
  <rect x="36" y="63" width="48" height="7" rx="6" fill="rgba(255,255,255,0.12)"/>
  <!-- Head bottom shadow -->
  <rect x="36" y="98" width="48" height="7" rx="0 0 6 6" fill="rgba(0,0,0,0.1)"/>

  <!-- Neck -->
  <rect x="46" y="105" width="28" height="10" rx="4" fill="#c9a84c"/>
  <rect x="48" y="105" width="24" height="3" fill="rgba(0,0,0,0.12)"/>

  <!-- Eyebrows -->
  <path d="M42 74 Q46.5 70.5 51 72.5" fill="none" stroke="#13110a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M69 72.5 Q73.5 70.5 78 74" fill="none" stroke="#13110a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <circle cx="48" cy="80" r="5" fill="#13110a"/>
  <circle cx="72" cy="80" r="5" fill="#13110a"/>
  <circle cx="49.8" cy="78.2" r="1.6" fill="white"/>
  <circle cx="73.8" cy="78.2" r="1.6" fill="white"/>

  <!-- Smile — wide open LEGO grin -->
  <path d="M42 91 Q60 103 78 91 Q72 100 60 102 Q48 100 42 91 Z" fill="#13110a"/>
  <path d="M42 91 Q60 103 78 91" fill="none" stroke="#13110a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Teeth -->
  <path d="M45 92.5 Q60 102 75 92.5 Q71 99 60 100.5 Q49 99 45 92.5 Z" fill="white"/>
  <!-- Teeth dividers -->
  <line x1="60" y1="93" x2="60" y2="100" stroke="#e0d8c8" stroke-width="0.8"/>
  <line x1="52.5" y1="93.5" x2="52" y2="99.5" stroke="#e0d8c8" stroke-width="0.8"/>
  <line x1="67.5" y1="93.5" x2="68" y2="99.5" stroke="#e0d8c8" stroke-width="0.8"/>

  <!-- Cheek blush -->
  <circle cx="38" cy="87" r="3.5" fill="rgba(210,150,80,0.3)"/>
  <circle cx="82" cy="87" r="3.5" fill="rgba(210,150,80,0.3)"/>
</svg>
